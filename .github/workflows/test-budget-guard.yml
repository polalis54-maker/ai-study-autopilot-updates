name: Test campaign budget guard
on:
  push:
    branches: [feature/campaign-budget-1000-jpy]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile release_files/update_watchdog.py
      - run: python3 tests/test_campaign_budget.py
      - run: python3 tests/test_release.py
      - run: python3 tests/test_campaign.py
      - run: python3 tests/test_mobile.py
      - run: python3 tests/test_trophies.py
