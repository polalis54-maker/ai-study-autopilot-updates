name: Revision pipeline verification
on:
  push:
    branches: [feature/local-unverified-practice-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile release_files/update_watchdog.py
      - run: python3 -m py_compile release_files/live_progress.py
      - run: python3 tests/test_revision_pipeline.py
      - run: python3 tests/test_revision_http.py
      - run: python3 tests/test_revision_batch.py
      - run: python3 tests/test_revision_status.py
      - run: python3 tests/test_revision_compare.py
      - run: python3 tests/test_release.py
      - run: python3 tests/test_campaign.py
      - run: python3 tests/test_mobile.py
      - run: python3 tests/test_verified_study_sync.py
      - run: python3 tests/test_revision_staging.py
      - run: python3 tests/test_revision_approval.py
      - run: python3 tests/test_revision_feedback.py
      - run: python3 tests/test_practice_preview.py
      - run: python3 tests/test_trophies.py
      - run: python3 tests/test_campaign_budget.py
